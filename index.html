<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PlantRx — Health & Diagnosis</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #0F1412;
      --surface: #18201C;
      --surface-border: #26332D;
      --text: #ECF2EE;
      --text-muted: #8E9F95;
      
      --color-healthy: #22C55E;
      --color-stressed: #EAB308;
      --color-diseased: #EF4444;
      --color-pest: #F97316;
      
      --radius: 12px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 1rem;
    }

    header {
      max-width: 680px;
      margin: 0 auto 1.5rem;
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--surface-border);
      padding-bottom: 0.75rem;
    }

    .brand {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      font-size: 1.15rem;
      color: #FFF;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .lang-select {
      background: var(--surface);
      border: 1px solid var(--surface-border);
      color: var(--text);
      padding: 0.35rem 0.65rem;
      border-radius: 6px;
      font-size: 0.85rem;
      cursor: pointer;
      outline: none;
    }

    main {
      max-width: 680px;
      margin: 0 auto;
      width: 100%;
      flex: 1;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--surface-border);
      border-radius: var(--radius);
      padding: 1.5rem;
      margin-bottom: 1rem;
    }

    .dropzone {
      border: 2px dashed var(--surface-border);
      border-radius: 8px;
      padding: 2.5rem 1rem;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.15s ease, background 0.15s ease;
    }
    .dropzone.dragover {
      border-color: var(--color-healthy);
      background: rgba(34, 197, 94, 0.05);
    }

    .btn-row {
      display: flex;
      gap: 0.75rem;
      justify-content: center;
      margin-top: 1.25rem;
    }

    .btn {
      padding: 0.65rem 1.25rem;
      font-weight: 600;
      font-size: 0.88rem;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      transition: opacity 0.15s ease;
    }
    .btn:active { transform: scale(0.98); }
    .btn-primary { background: var(--color-healthy); color: #000; }
    .btn-secondary { background: var(--surface-border); color: #FFF; }

    /* Results */
    #resultView { display: none; }
    .diagnosis-header {
      display: flex;
      gap: 1rem;
      align-items: flex-start;
      margin-bottom: 1rem;
    }
    .plant-preview {
      width: 90px;
      height: 90px;
      object-fit: cover;
      border-radius: 8px;
      border: 1px solid var(--surface-border);
      background: #000;
    }

    .status-badge {
      display: inline-block;
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      font-size: 0.78rem;
      padding: 0.25rem 0.6rem;
      border-radius: 4px;
      text-transform: uppercase;
      margin-bottom: 0.4rem;
    }

    .status-HEALTHY { background: rgba(34, 197, 94, 0.15); color: var(--color-healthy); }
    .status-STRESSED { background: rgba(234, 179, 8, 0.15); color: var(--color-stressed); }
    .status-DISEASED { background: rgba(239, 68, 68, 0.15); color: var(--color-diseased); }
    .status-PEST { background: rgba(249, 115, 22, 0.15); color: var(--color-pest); }

    .data-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.75rem;
      margin: 1rem 0;
    }
    .data-box {
      background: rgba(0,0,0,0.3);
      border: 1px solid var(--surface-border);
      padding: 0.75rem;
      border-radius: 8px;
    }
    .data-label {
      font-size: 0.72rem;
      text-transform: uppercase;
      color: var(--text-muted);
      font-weight: 600;
      margin-bottom: 0.2rem;
    }
    .data-val { font-size: 0.9rem; font-weight: 500; }

    .treatment-box {
      background: rgba(34, 197, 94, 0.05);
      border-left: 3px solid var(--color-healthy);
      padding: 0.85rem 1rem;
      margin: 1rem 0;
      border-radius: 0 8px 8px 0;
    }
    .treatment-box.danger {
      background: rgba(239, 68, 68, 0.05);
      border-color: var(--color-diseased);
    }

    .loader {
      display: none;
      text-align: center;
      padding: 2.5rem 1rem;
      color: var(--text-muted);
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#22C55E" stroke-width="2.5"><path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z"/><path d="M2 21c0-3 1.85-5.36 5.08-6"/></svg>
      PlantRx
    </div>
    <select id="langSelect" class="lang-select" onchange="switchLang(this.value)">
      <option value="en">English</option>
      <option value="hi">हिन्दी</option>
      <option value="pa">ਪੰਜਾਬੀ</option>
    </select>
  </header>

  <main>
    <input type="file" id="cam" accept="image/*" capture="environment" style="display:none">
    <input type="file" id="file" accept="image/*" style="display:none">

    <!-- Upload View -->
    <div class="card" id="uploadCard">
      <div class="dropzone" id="dropzone">
        <p style="font-size: 0.95rem; font-weight: 600;" id="dropLabel">Scan Foliage or Leaf Problem</p>
        <p style="font-size: 0.8rem; color: var(--text-muted); margin-top: 0.3rem;">Auto-clamps to 768px (1 Gemini Tile • Zero Cost Bloat)</p>
        <div class="btn-row">
          <button class="btn btn-primary" id="btnSnap">Camera</button>
          <button class="btn btn-secondary" id="btnUpload">Upload</button>
        </div>
      </div>
    </div>

    <!-- Spinner -->
    <div class="card loader" id="loader">
      <p id="lblDiagnosing">Analyzing pathology with Gemini 3.5 Flash-Lite...</p>
    </div>

    <!-- Result Dashboard -->
    <div class="card" id="resultView">
      <div class="diagnosis-header">
        <img id="plantImg" class="plant-preview" alt="Leaf Sample">
        <div>
          <span id="diagBadge" class="status-badge">HEALTHY</span>
          <h2 id="plantName" style="font-size: 1.25rem;">Plant Name</h2>
          <p id="plantLatin" style="font-style: italic; color: var(--text-muted); font-size: 0.85rem;"></p>
        </div>
      </div>

      <div class="treatment-box" id="treatmentBox">
        <div class="data-label" id="lblIssue">DIAGNOSIS & ACTION</div>
        <div id="issueText" style="font-weight: 600; font-size: 0.95rem; margin-bottom: 0.3rem;">None</div>
        <div id="symptomsText" style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 0.4rem;"></div>
        <div id="treatmentText" style="font-size: 0.88rem; font-weight: 500;"></div>
      </div>

      <div class="data-grid">
        <div class="data-box">
          <div class="data-label" id="lblLight">Light Exposure</div>
          <div class="data-val" id="valLight">-</div>
        </div>
        <div class="data-box">
          <div class="data-label" id="lblWater">Water Routine</div>
          <div class="data-val" id="valWater">-</div>
        </div>
        <div class="data-box" style="grid-column: span 2;">
          <div class="data-label" id="lblPet">Pet Toxicity</div>
          <div class="data-val" id="valPet">-</div>
        </div>
      </div>

      <button class="btn btn-secondary" style="width: 100%; justify-content: center; margin-top: 0.5rem;" onclick="resetUI()" id="btnNew">
        New Scan
      </button>
    </div>
  </main>

  <canvas id="cvs" style="display:none"></canvas>

  <script>
    const i18n = {
      en: {
        drop: "Scan Foliage or Leaf Problem",
        snap: "Camera",
        upload: "Upload",
        loading: "Analyzing pathology with Gemini 3.5 Flash-Lite...",
        diagRemedy: "DIAGNOSIS & ACTION",
        light: "Light Exposure",
        water: "Water Routine",
        pet: "Pet Toxicity",
        newScan: "New Scan",
        safe: "Safe for Pets",
        toxic: "Toxic to Pets",
        noPlant: "No plant detected. Ensure the foliage is centered and well lit.",
        status: {
          HEALTHY: "HEALTHY",
          STRESSED: "STRESSED",
          DISEASED: "DISEASED",
          PEST: "PEST INFESTED"
        }
      },
      hi: {
        drop: "पत्ती या पौधे की समस्या स्कैन करें",
        snap: "कैमरा",
        upload: "अपलोड",
        loading: "Gemini 3.5 Flash-Lite द्वारा विश्लेषण जारी है...",
        diagRemedy: "जांच और उपचार",
        light: "धूप की आवश्यकता",
        water: "पानी का नियम",
        pet: "पालतू सुरक्षा",
        newScan: "नया स्कैन",
        safe: "पालतू जानवरों के लिए सुरक्षित",
        toxic: "पालतू जानवरों के लिए विषाक्त",
        noPlant: "कोई पौधा नहीं मिला। कृपया पत्ती की स्पष्ट फोटो लें।",
        status: {
          HEALTHY: "स्वस्थ",
          STRESSED: "तनावग्रस्त",
          DISEASED: "रोगग्रस्त",
          PEST: "कीट प्रकोप"
        }
      },
      pa: {
        drop: "ਪੌਦੇ ਜਾਂ ਪੱਤੇ ਦੀ ਸਮੱਸਿਆ ਸਕੈਨ ਕਰੋ",
        snap: "ਕੈਮਰਾ",
        upload: "ਅੱਪਲੋਡ",
        loading: "Gemini 3.5 Flash-Lite ਦੁਆਰਾ ਜਾਂਚ ਜਾਰੀ ਹੈ...",
        diagRemedy: "ਜਾਂਚ ਅਤੇ ਇਲਾਜ",
        light: "ਧੁੱਪ ਦੀ ਲੋੜ",
        water: "ਪਾਣੀ ਦੀ ਲੋੜ",
        pet: "ਪਾਲਤੂਆਂ ਲਈ ਸੁਰੱਖਿਆ",
        newScan: "ਨਵਾਂ ਸਕੈਨ",
        safe: "ਪਾਲਤੂਆਂ ਲਈ ਸੁਰੱਖਿਅਤ",
        toxic: "ਪਾਲਤੂਆਂ ਲਈ ਹਾਨੀਕਾਰਕ",
        noPlant: "ਕੋਈ ਪੌਦਾ ਨਹੀਂ ਮਿਲਿਆ। ਕਿਰਪਾ ਕਰਕੇ ਸਾਫ਼ ਫੋਟੋ ਲਵੋ।",
        status: {
          HEALTHY: "ਤੰਦਰੁਸਤ",
          STRESSED: "ਤਣਾਅ ਵਿੱਚ",
          DISEASED: "ਬਿਮਾਰ",
          PEST: "ਕੀੜੇ ਦਾ ਹਮਲਾ"
        }
      }
    };

    let currentLang = localStorage.getItem('prx_lang') || 'en';

    function switchLang(lang) {
      currentLang = lang;
      localStorage.setItem('prx_lang', lang);
      document.getElementById('langSelect').value = lang;
      const t = i18n[lang] || i18n.en;
      document.getElementById('dropLabel').innerText = t.drop;
      document.getElementById('btnSnap').innerText = t.snap;
      document.getElementById('btnUpload').innerText = t.upload;
      document.getElementById('lblDiagnosing').innerText = t.loading;
      document.getElementById('lblIssue').innerText = t.diagRemedy;
      document.getElementById('lblLight').innerText = t.light;
      document.getElementById('lblWater').innerText = t.water;
      document.getElementById('lblPet').innerText = t.pet;
      document.getElementById('btnNew').innerText = t.newScan;
    }
    switchLang(currentLang);

    const cam = document.getElementById('cam');
    const file = document.getElementById('file');
    const dropzone = document.getElementById('dropzone');

    document.getElementById('btnSnap').onclick = (e) => { e.stopPropagation(); cam.click(); };
    document.getElementById('btnUpload').onclick = (e) => { e.stopPropagation(); file.click(); };
    dropzone.onclick = () => file.click();

    [cam, file].forEach(el => el.addEventListener('change', e => {
      if (e.target.files?.[0]) processImage(e.target.files[0]);
    }));

    ['dragover', 'dragenter'].forEach(ev => {
      dropzone.addEventListener(ev, e => { e.preventDefault(); dropzone.classList.add('dragover'); });
    });
    ['dragleave', 'drop'].forEach(ev => {
      dropzone.addEventListener(ev, e => { e.preventDefault(); dropzone.classList.remove('dragover'); });
    });
    dropzone.addEventListener('drop', e => {
      if (e.dataTransfer?.files?.[0]) processImage(e.dataTransfer.files[0]);
    });

    // Clamps image strictly to max 768px: fits in 1 Gemini image tile (258 tokens instead of 1032+)
    function processImage(fileObj) {
      setLoading(true);
      const reader = new FileReader();
      reader.onload = (e) => {
        const img = new Image();
        img.onload = () => {
          const max = 768;
          let w = img.width, h = img.height;
          if (w > max || h > max) {
            if (w > h) { h = Math.round((h * max) / w); w = max; }
            else { w = Math.round((w * max) / h); h = max; }
          }
          const cvs = document.getElementById('cvs');
          cvs.width = w; cvs.height = h;
          const ctx = cvs.getContext('2d');
          
          // White fill ensures transparent PNGs don't render black
          ctx.fillStyle = "#FFFFFF";
          ctx.fillRect(0, 0, w, h);
          ctx.drawImage(img, 0, 0, w, h);

          const dataUrl = cvs.toDataURL('image/jpeg', 0.65);
          document.getElementById('plantImg').src = dataUrl;
          callAPI(dataUrl.split(',')[1]);
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(fileObj);
    }

    async function callAPI(base64Data) {
      const t = i18n[currentLang] || i18n.en;
      try {
        const res = await fetch('/api/identify', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ image: base64Data, mimeType: 'image/jpeg', language: currentLang })
        });
        
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Server error occurred');

        if (!data.is_plant) {
          alert(t.noPlant);
          resetUI();
          return;
        }

        renderResult(data);
      } catch (err) {
        alert(err.message);
        resetUI();
      }
    }

    function renderResult(d) {
      setLoading(false);
      document.getElementById('uploadCard').style.display = 'none';
      document.getElementById('resultView').style.display = 'block';

      const t = i18n[currentLang] || i18n.en;
      document.getElementById('plantName').innerText = d.name || 'Identified Plant';
      document.getElementById('plantLatin').innerText = d.latin_name || '';

      const st = (d.status || 'HEALTHY').toUpperCase();
      const badge = document.getElementById('diagBadge');
      badge.className = `status-badge status-${st}`;
      badge.innerText = t.status[st] || st;

      const treatBox = document.getElementById('treatmentBox');
      treatBox.className = (st === 'HEALTHY') ? 'treatment-box' : 'treatment-box danger';

      document.getElementById('issueText').innerText = d.issue || 'None';
      document.getElementById('symptomsText').innerText = d.symptoms || '';
      document.getElementById('treatmentText').innerText = d.treatment || '';

      document.getElementById('valLight').innerText = d.light || '-';
      document.getElementById('valWater').innerText = d.water || '-';
      
      const petEl = document.getElementById('valPet');
      petEl.innerText = d.pet_safe ? t.safe : t.toxic;
      petEl.style.color = d.pet_safe ? 'var(--color-healthy)' : 'var(--color-diseased)';
    }

    function setLoading(isLoading) {
      document.getElementById('uploadCard').style.display = isLoading ? 'none' : 'block';
      document.getElementById('loader').style.display = isLoading ? 'block' : 'none';
      document.getElementById('resultView').style.display = 'none';
    }

    function resetUI() {
      setLoading(false);
      cam.value = ''; file.value = '';
      document.getElementById('uploadCard').style.display = 'block';
      document.getElementById('resultView').style.display = 'none';
    }
  </script>
</body>
</html>
